<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" id="card-preview-svg">
  <defs>
    <!-- Shadow for realistic card mockup -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>

    <!-- Project 1 Logo Miniaturized Definition -->
    <g id="mini-logo">
      <circle cx="50" cy="50" r="42" stroke="#b88a4b" stroke-width="1.8" fill="#ffffff"/>
      <circle cx="50" cy="50" r="30" stroke="#b88a4b" stroke-width="1" fill="none"/>
      <!-- Top arc text -->
      <path id="miniTopArc" d="M 22,50 A 28,28 0 0,1 78,50" fill="none"/>
      <text font-size="4.8" font-family="'Kantumruy Pro', sans-serif" font-weight="700" fill="#b88a4b">
        <textPath href="#miniTopArc" startOffset="50%" text-anchor="middle">សាលាបង្រៀនភេសជ្ជៈ</textPath>
      </text>
      <!-- Bottom arc text -->
      <path id="miniBottomArc" d="M 22,50 A 28,28 0 0,0 78,50" fill="none"/>
      <text font-size="4.2" font-family="Georgia, serif" font-weight="700" fill="#b88a4b" letter-spacing="0.5">
        <textPath href="#miniBottomArc" startOffset="50%" text-anchor="middle">BAVERAGE SCHOOL</textPath>
      </text>
      <!-- Coffee Cup -->
      <ellipse cx="50" cy="53" rx="12" ry="3.5" fill="#b88a4b"/>
      <path d="M 40,53 C 40,64 45,71 50,71 C 55,71 60,64 60,53 Z" fill="#64442e"/>
      <ellipse cx="50" cy="73" rx="16" ry="2.5" stroke="#b88a4b" stroke-width="1" fill="none"/>
      <!-- Handle -->
      <path d="M 59,57 C 66,57 66,66 58,68" stroke="#b88a4b" stroke-width="1.5" fill="none"/>
      <!-- Steam -->
      <path d="M 47,48 C 45,43 51,41 48,36" stroke="#b88a4b" stroke-width="0.8" fill="none"/>
      <path d="M 52,48 C 50,44 56,42 53,38" stroke="#b88a4b" stroke-width="0.8" fill="none"/>
      <!-- Year -->
      <text x="36" y="52" font-size="4" font-family="sans-serif" font-weight="700" fill="#b88a4b">LTSP</text>
      <text x="64" y="52" font-size="4" font-family="sans-serif" font-weight="700" fill="#b88a4b">2026</text>
    </g>

    <!-- Bleed guide pattern -->
    <pattern id="bleedGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <style>
    .card-bg { fill: #ffffff; }
    .color-cyan { fill: #008fd5; }
    .color-charcoal { fill: #1a2b49; }
    .txt-khmer-bold { font-family: 'Kantumruy Pro', 'Khmer OS Muol Light', 'Segoe UI', sans-serif; font-weight: 700; }
    .txt-contact { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; fill: #475569; }
    .bleed-box { stroke: #ef4444; stroke-dasharray: 4,4; stroke-width: 1; fill: none; }
    .crop-mark { stroke: #000000; stroke-width: 0.8; }
    .label-badge { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <!-- ==================== FRONT SIDE (SIDE A) ==================== -->
  <g id="card-front" transform="translate(30, 45)">
    <!-- Label -->
    <text x="0" y="-12" class="label-badge" fill="#008fd5">▲ ផ្ទៃខាងមុខ (FRONT SIDE) — 85mm &#215; 50mm</text>

    <!-- Bleed Area (91mm x 56mm scaled) -->
    <rect x="-15" y="-15" width="455" height="280" fill="none" class="bleed-box"/>

    <!-- Crop Marks at 4 Corners -->
    <g class="crop-mark">
      <!-- Top Left -->
      <line x1="-25" y1="0" x2="-8" y2="0"/>
      <line x1="0" y1="-25" x2="0" y2="-8"/>
      <!-- Top Right -->
      <line x1="425" y1="-25" x2="425" y2="-8"/>
      <line x1="433" y1="0" x2="450" y2="0"/>
      <!-- Bottom Left -->
      <line x1="-25" y1="250" x2="-8" y2="250"/>
      <line x1="0" y1="258" x2="0" y2="275"/>
      <!-- Bottom Right -->
      <line x1="433" y1="250" x2="450" y2="250"/>
      <line x1="425" y1="258" x2="425" y2="275"/>
    </g>

    <!-- Card Body (Actual Cut Line: 425px x 250px => 85mm x 50mm) -->
    <rect x="0" y="0" width="425" height="250" rx="3" class="card-bg" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Decorative Top Left Cyan Angle Banner -->
    <path d="M 0,0 L 175,0 L 195,58 L 0,58 Z" fill="#008fd5"/>
    <!-- Thin Cyan Accent Line -->
    <line x1="195" y1="58" x2="425" y2="58" stroke="#008fd5" stroke-width="2"/>

    <!-- Name & Title -->
    <text x="18" y="32" class="txt-khmer-bold" font-size="20" fill="#ffffff">ហ៊ាន សុខា</text>
    <text x="18" y="49" font-family="'Kantumruy Pro', sans-serif" font-size="10.5" fill="#e0f2fe" font-weight="600">អ្នកគ្រប់គ្រងទូទៅ (General Manager)</text>

    <!-- Contact Info Rows -->
    <g transform="translate(18, 85)">
      <!-- Phone Row -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#008fd5"/>
        <path d="M 5,5 C 5,11 7,13 13,13 L 11,11 C 9,11 7,9 7,7 Z" fill="#ffffff" transform="scale(0.9) translate(1,1)"/>
        <!-- Phone SVG icon -->
        <path d="M 6.5,5.5 C 6,5.5 5.5,6 5.5,6.5 C 5.5,10 8,12.5 11.5,12.5 C 12,12.5 12.5,12 12.5,11.5 L 11.5,10 C 11.2,9.7 10.7,9.7 10.5,10 L 9.8,10.7 C 8.8,10.1 7.9,9.2 7.3,8.2 L 8,7.5 C 8.3,7.3 8.3,6.8 8,6.5 Z" fill="#ffffff"/>
        <text x="26" y="9" class="txt-contact" font-weight="600">+123 456 789 000</text>
        <text x="26" y="19" class="txt-contact">+123 456 789 000</text>
      </g>

      <!-- Email / Web Row -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#008fd5"/>
        <rect x="4" y="5.5" width="10" height="7" rx="1" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <polyline points="4,6.5 9,10 14,6.5" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <text x="26" y="9" class="txt-contact" font-weight="600">yourgmail@name.com</text>
        <text x="26" y="19" class="txt-contact">www.beverageschool.edu.kh</text>
      </g>

      <!-- Location Row -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#008fd5"/>
        <circle cx="9" cy="7.5" r="2" fill="#ffffff"/>
        <path d="M 9,4 C 7,4 5.5,5.5 5.5,7.5 C 5.5,10.5 9,14 9,14 C 9,14 12.5,10.5 12.5,7.5 C 12.5,5.5 11,4 9,4 Z" fill="none" stroke="#ffffff" stroke-width="1.1"/>
        <text x="26" y="9" class="txt-contact" font-weight="600">123 Your Street Name</text>
        <text x="26" y="19" class="txt-contact">Phnom Penh, Cambodia</text>
      </g>
    </g>

    <!-- QR Code Graphic Matrix -->
    <g transform="translate(175, 168)">
      <rect x="0" y="0" width="46" height="46" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- QR corner squares -->
      <rect x="4" y="4" width="12" height="12" fill="#008fd5"/>
      <rect x="6" y="6" width="8" height="8" fill="#ffffff"/>
      <rect x="8" y="8" width="4" height="4" fill="#1a2b49"/>

      <rect x="30" y="4" width="12" height="12" fill="#008fd5"/>
      <rect x="32" y="6" width="8" height="8" fill="#ffffff"/>
      <rect x="34" y="8" width="4" height="4" fill="#1a2b49"/>

      <rect x="4" y="30" width="12" height="12" fill="#008fd5"/>
      <rect x="6" y="32" width="8" height="8" fill="#ffffff"/>
      <rect x="8" y="34" width="4" height="4" fill="#1a2b49"/>

      <!-- QR pattern dots -->
      <rect x="20" y="6" width="5" height="3" fill="#1a2b49"/>
      <rect x="20" y="14" width="4" height="5" fill="#008fd5"/>
      <rect x="10" y="20" width="4" height="4" fill="#1a2b49"/>
      <rect x="18" y="22" width="6" height="6" fill="#1a2b49"/>
      <rect x="28" y="20" width="5" height="4" fill="#008fd5"/>
      <rect x="22" y="34" width="4" height="6" fill="#1a2b49"/>
      <rect x="30" y="30" width="6" height="4" fill="#008fd5"/>
      <rect x="38" y="38" width="4" height="4" fill="#1a2b49"/>
    </g>

    <!-- Geometric Origami / Ribbon Graphic on Right -->
    <g transform="translate(245, 0)">
      <!-- Dark Charcoal Top Chevron -->
      <path d="M 50,0 L 140,0 L 95,95 L 5,95 Z" fill="#1a2b49"/>
      <!-- Bright Cyan Center Diamond -->
      <path d="M 95,95 L 140,185 L 50,185 L 5,95 Z" fill="#008fd5"/>
      <!-- Right cyan diagonal triangle -->
      <path d="M 140,0 L 180,0 L 180,250 L 140,250 L 95,160 Z" fill="#008fd5" opacity="0.15"/>
    </g>

    <!-- Project 1 Logo Placed on Business Card -->
    <use href="#mini-logo" x="310" y="20"/>
  </g>


  <!-- ==================== BACK SIDE (SIDE B) ==================== -->
  <g id="card-back" transform="translate(500, 45)">
    <!-- Label -->
    <text x="0" y="-12" class="label-badge" fill="#1a2b49">▲ ផ្ទៃខាងក្រោយ (BACK SIDE) — 85mm &#215; 50mm</text>

    <!-- Bleed Area -->
    <rect x="-15" y="-15" width="455" height="280" fill="none" class="bleed-box"/>

    <!-- Crop Marks at 4 Corners -->
    <g class="crop-mark">
      <line x1="-25" y1="0" x2="-8" y2="0"/>
      <line x1="0" y1="-25" x2="0" y2="-8"/>
      <line x1="425" y1="-25" x2="425" y2="-8"/>
      <line x1="433" y1="0" x2="450" y2="0"/>
      <line x1="-25" y1="250" x2="-8" y2="250"/>
      <line x1="0" y1="258" x2="0" y2="275"/>
      <line x1="433" y1="250" x2="450" y2="250"/>
      <line x1="425" y1="258" x2="425" y2="275"/>
    </g>

    <!-- Card Body -->
    <rect x="0" y="0" width="425" height="250" rx="3" class="card-bg" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Back Side Bold Geometric Graphics (Hourglass / Chevron fold) -->
    <!-- Top Charcoal Angled Triangle -->
    <path d="M 0,0 L 425,0 L 370,115 L 55,115 Z" fill="#1a2b49"/>

    <!-- Bottom Cyan Angled Triangle -->
    <path d="M 55,135 L 370,135 L 425,250 L 0,250 Z" fill="#008fd5"/>

    <!-- Center White Diamond Negative Space containing Large Logo -->
    <g transform="translate(162, 75)">
      <circle cx="50" cy="50" r="48" fill="#ffffff" filter="url(#cardShadow)"/>
      <use href="#mini-logo" x="0" y="0"/>
    </g>

    <!-- Corporate Branding Slogan / Title -->
    <text x="212" y="195" font-family="'Kantumruy Pro', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      សាលាបង្រៀនភេសជ្ជៈ • BEVERAGE SCHOOL
    </text>
    <text x="212" y="215" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#e0f2fe" text-anchor="middle" letter-spacing="2">
      PROFESSIONAL BARISTA &amp; DRINKS ACADEMY
    </text>
  </g>

  <!-- ==================== FOOTER SPECIFICATIONS & GUIDE ==================== -->
  <g transform="translate(30, 360)">
    <!-- Legend Card -->
    <rect x="0" y="0" width="890" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="25" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#1e293b">
      📐 លក្ខខណ្ឌបច្ចេកទេស និងខ្នាតព្រីន (Print &amp; Pre-press Technical Blueprint):
    </text>

    <!-- Metric 1: Size -->
    <g transform="translate(25, 50)">
      <rect x="0" y="0" width="190" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">FINISHED SIZE (ខ្នាតកាត់សម្រេច)</text>
      <text x="15" y="48" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#008fd5">85 mm &#215; 50 mm</text>
      <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94a3b8">Standard Card Dimension</text>
    </g>

    <!-- Metric 2: Bleed -->
    <g transform="translate(235, 50)">
      <rect x="0" y="0" width="190" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ef4444">BLEED (ខ្នាតចំណៀរជុំវិញ)</text>
      <text x="15" y="48" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#ef4444">3 mm (ជុំវិញ)</text>
      <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94a3b8">Total Canvas: 91 &#215; 56 mm</text>
    </g>

    <!-- Metric 3: Colors -->
    <g transform="translate(445, 50)">
      <rect x="0" y="0" width="200" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a2b49">COLOR SPECIFICATION</text>
      <text x="15" y="48" font-family="Consolas, monospace" font-size="15" font-weight="800" fill="#1a2b49">2 Spot Colors (No Tint)</text>
      <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#008fd5">Cyan &amp; Charcoal Navy</text>
    </g>

    <!-- Metric 4: Imposition -->
    <g transform="translate(665, 50)">
      <rect x="0" y="0" width="200" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#16a34a">A4 IMPOSITION (រៀបលើ A4)</text>
      <text x="15" y="48" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#16a34a">10 Cards / Sheet</text>
      <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94a3b8">2 Columns &#215; 5 Rows + Crop Marks</text>
    </g>
  </g>
</svg>