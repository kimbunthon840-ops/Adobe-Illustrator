<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 848" width="100%" height="100%" id="imposition-svg">
  <!-- A4 Paper: 210mm x 297mm (Ratio: 1 : 1.414). In SVG: 600 x 848.5 -->
  <defs>
    <filter id="pageShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Mini single card representation (85mm x 50mm) -->
    <!-- Scale: A4 is 210mm wide = 560px drawable (ratio ~ 2.66 px/mm) -->
    <!-- Card 85mm * 2.66 = 226px, 50mm * 2.66 = 133px -->
    <g id="grid-card">
      <rect x="0" y="0" width="226" height="133" fill="#ffffff" stroke="#008fd5" stroke-width="1"/>
      <path d="M 0,0 L 90,0 L 105,30 L 0,30 Z" fill="#008fd5"/>
      <line x1="105" y1="30" x2="226" y2="30" stroke="#008fd5" stroke-width="1"/>
      <text x="10" y="18" font-family="'Kantumruy Pro', sans-serif" font-size="10" font-weight="700" fill="#ffffff">ហ៊ាន សុខា</text>
      <text x="10" y="26" font-family="sans-serif" font-size="6" fill="#e0f2fe">អ្នកគ្រប់គ្រងទូទៅ</text>
      
      <!-- Mini text lines -->
      <circle cx="12" cy="45" r="3" fill="#008fd5"/>
      <line x1="20" y1="45" x2="80" y2="45" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="12" cy="60" r="3" fill="#008fd5"/>
      <line x1="20" y1="60" x2="90" y2="60" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="12" cy="75" r="3" fill="#008fd5"/>
      <line x1="20" y1="75" x2="85" y2="75" stroke="#cbd5e1" stroke-width="2"/>

      <!-- QR -->
      <rect x="80" y="90" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
      <rect x="83" y="93" width="7" height="7" fill="#008fd5"/>
      <rect x="96" y="93" width="7" height="7" fill="#008fd5"/>
      <rect x="83" y="106" width="7" height="7" fill="#008fd5"/>

      <!-- Geometric Fold -->
      <path d="M 140,0 L 190,0 L 165,50 L 115,50 Z" fill="#1a2b49"/>
      <path d="M 165,50 L 190,100 L 140,100 L 115,50 Z" fill="#008fd5"/>

      <!-- Mini logo -->
      <circle cx="195" cy="25" r="14" stroke="#b88a4b" stroke-width="0.8" fill="#ffffff"/>
      <ellipse cx="195" cy="27" rx="5" ry="1.5" fill="#64442e"/>
      <text x="195" y="18" font-size="3" font-family="sans-serif" fill="#b88a4b" text-anchor="middle">BEVERAGE</text>
    </g>

    <!-- Crop marks pair -->
    <g id="crop-cross">
      <line x1="-12" y1="0" x2="-2" y2="0" stroke="#000000" stroke-width="0.8"/>
      <line x1="0" y1="-12" x2="0" y2="-2" stroke="#000000" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Sheet Background (A4 Sheet 210 x 297 mm) -->
  <rect x="20" y="20" width="560" height="808" fill="#ffffff" rx="8" filter="url(#pageShadow)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Sheet Header / Margin guides -->
  <text x="300" y="55" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">
    ប្លង់រៀបនាមប័ណ្ណ ១០ សន្លឹកលើក្រដាស A4 (A4 Imposition Sheet — 10 Business Cards)
  </text>
  <text x="300" y="72" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    2 Columns &#215; 5 Rows • Finished Size: 85mm &#215; 50mm • Bleed &amp; Crop Marks Included
  </text>

  <!-- Center guideline -->
  <line x1="300" y1="90" x2="300" y2="800" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="0.8"/>

  <!-- ==================== 10 CARDS GRID (2 cols x 5 rows) ==================== -->
  <!-- Col 1: X = 55, Col 2: X = 318 -->
  <!-- Row 1: Y = 95 -->
  <!-- Row 2: Y = 236 -->
  <!-- Row 3: Y = 377 -->
  <!-- Row 4: Y = 518 -->
  <!-- Row 5: Y = 659 -->

  <!-- ROW 1 -->
  <use href="#grid-card" x="60" y="95"/>
  <use href="#grid-card" x="314" y="95"/>

  <!-- ROW 2 -->
  <use href="#grid-card" x="60" y="236"/>
  <use href="#grid-card" x="314" y="236"/>

  <!-- ROW 3 -->
  <use href="#grid-card" x="60" y="377"/>
  <use href="#grid-card" x="314" y="377"/>

  <!-- ROW 4 -->
  <use href="#grid-card" x="60" y="518"/>
  <use href="#grid-card" x="314" y="518"/>

  <!-- ROW 5 -->
  <use href="#grid-card" x="60" y="659"/>
  <use href="#grid-card" x="314" y="659"/>

  <!-- Trim & Cutting Lines around grid -->
  <!-- Outer horizontal crop lines -->
  <line x1="35" y1="95" x2="52" y2="95" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="95" x2="565" y2="95" stroke="#000000" stroke-width="0.8"/>

  <line x1="35" y1="228" x2="52" y2="228" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="228" x2="565" y2="228" stroke="#000000" stroke-width="0.8"/>

  <line x1="35" y1="369" x2="52" y2="369" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="369" x2="565" y2="369" stroke="#000000" stroke-width="0.8"/>

  <line x1="35" y1="510" x2="52" y2="510" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="510" x2="565" y2="510" stroke="#000000" stroke-width="0.8"/>

  <line x1="35" y1="651" x2="52" y2="651" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="651" x2="565" y2="651" stroke="#000000" stroke-width="0.8"/>

  <line x1="35" y1="792" x2="52" y2="792" stroke="#000000" stroke-width="0.8"/>
  <line x1="548" y1="792" x2="565" y2="792" stroke="#000000" stroke-width="0.8"/>

  <!-- Vertical top/bottom crop lines -->
  <line x1="60" y1="75" x2="60" y2="88" stroke="#000000" stroke-width="0.8"/>
  <line x1="286" y1="75" x2="286" y2="88" stroke="#000000" stroke-width="0.8"/>
  <line x1="314" y1="75" x2="314" y2="88" stroke="#000000" stroke-width="0.8"/>
  <line x1="540" y1="75" x2="540" y2="88" stroke="#000000" stroke-width="0.8"/>

  <line x1="60" y1="800" x2="60" y2="813" stroke="#000000" stroke-width="0.8"/>
  <line x1="286" y1="800" x2="286" y2="813" stroke="#000000" stroke-width="0.8"/>
  <line x1="314" y1="800" x2="314" y2="813" stroke="#000000" stroke-width="0.8"/>
  <line x1="540" y1="800" x2="540" y2="813" stroke="#000000" stroke-width="0.8"/>

  <!-- Footer Tag -->
  <text x="300" y="818" font-family="'Consolas', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
    ICC: Coated GRACoL 2006 • 100% Solid Spot / CMYK Colors • Trim Along Crop Marks
  </text>
</svg>